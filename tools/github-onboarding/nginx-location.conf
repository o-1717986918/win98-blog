# Include inside the win98.site vhost. The exact match takes precedence over location ^~ /.
location = /api/github-onboarding/register {
    limit_req zone=win98_onboarding burst=24 nodelay;
    limit_req zone=win98_onboarding_total burst=35 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    client_body_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 22s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection close;
    proxy_pass http://127.0.0.1:18100;
}
