name: win98-static

services:
  web:
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:daa17b944bac2b578e962da4c61ad72a59233b3c63abea17113acaf4e6b9aea4
    container_name: win98-blog-static
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WIN98_STATIC_PORT:-18099}:8080"
    volumes:
      - /opt/win98-static/releases:/srv/releases:ro
      - ./docker/static-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/security-headers.conf:/etc/nginx/security-headers.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
