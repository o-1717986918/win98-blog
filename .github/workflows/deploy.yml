name: deploy-cloudflare-pages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy a preview first; production is restricted to the production branch.
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PRODUCTION_BRANCH }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PUBLIC_COMMENTS_PROVIDER: ${{ vars.PUBLIC_COMMENTS_PROVIDER || 'none' }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
      PUBLIC_WALINE_SERVER_URL: ${{ vars.PUBLIC_WALINE_SERVER_URL }}
      PUBLIC_ANALYTICS_PROVIDER: ${{ vars.PUBLIC_ANALYTICS_PROVIDER || 'none' }}
      PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN }}
      PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
      PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select deployment branch
        id: target
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          production_branch="${CLOUDFLARE_PRODUCTION_BRANCH:-main}"
          if [[ "$REQUESTED_TARGET" == "production" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$production_branch" ]]; then
              echo "Production deployments must run from $production_branch, not $GITHUB_REF_NAME." >&2
              exit 1
            fi
            echo "branch=$production_branch" >> "$GITHUB_OUTPUT"
          else
            echo "branch=manual-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify build and deployment contract
        env:
          DEPLOY_BRANCH: ${{ steps.target.outputs.branch }}
        run: pnpm deploy:prepare
      - name: Upload to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.0"
          packageManager: pnpm
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ steps.target.outputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Record deployment URLs
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "### Cloudflare Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias: $DEPLOYMENT_ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"
